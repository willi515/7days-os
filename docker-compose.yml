version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: 7days_os_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_secret_password
      POSTGRES_DB: seven_days_os
    ports:
      - "5432:5432"
    volumes:
      - 7days_postgres_data:/var/lib/postgresql/data

volumes:
  7days_postgres_data:
    name: 7days_postgres_data
