version: '3.8'

services:
  # ==========================================
  # Database Engine (PostgreSQL 16 with RLS)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: 7days_os_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Super_Secure_Prod_Pwd_2026}
      POSTGRES_DB: ${DB_NAME:-seven_days_os}
    volumes:
      - 7days_postgres_data:/var/lib/postgresql/data
      - ./packages/database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 7days_network

  # ==========================================
  # Backend Core API Engine
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: 7days_os_prod_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-Super_Secure_Prod_Pwd_2026}
      DB_NAME: ${DB_NAME:-seven_days_os}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_7days_2026}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - 7days_network

  # ==========================================
  # Frontend Web & PWA Portal (Next.js 14)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: 7days_os_prod_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - 7days_network

volumes:
  7days_postgres_data:
    name: 7days_os_prod_postgres_data

networks:
  7days_network:
    name: 7days_os_network
    driver: bridge
